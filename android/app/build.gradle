plugins { id 'com.android.application' }

android {
    namespace 'in.captnemo.elstern'
    compileSdk 36
    defaultConfig {
        applicationId 'in.captnemo.elstern'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            storeFile = file(System.getenv('KS_FILE') ?: 'none')
            storePassword = System.getenv('KS_PASS')
            keyPassword = System.getenv('KS_PASS')
            keyAlias = 'elstern'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (System.getenv('KS_FILE')) signingConfig = signingConfigs.release
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
