name: android

on:
  push:
    branches: [main, android]
  pull_request:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: gradle --no-daemon assembleRelease
        working-directory: android

  apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: android
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      NAME: ${{ github.event.release.tag_name || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - if: github.event_name == 'release'
        name: Check tag matches versionName
        run: |
          v=$(sed -n "s/.*versionName '\(.*\)'/\1/p" android/app/build.gradle)
          [ "$TAG" = "v$v" ] || { echo "tag $TAG != v$v"; exit 1; }
      - name: Build signed APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          export KS_FILE="$RUNNER_TEMP/release.p12"
          base64 -d <<<"$KS_B64" > "$KS_FILE"
          gradle --no-daemon assembleRelease
          rm -f "$KS_FILE"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/elstern-$NAME.apk"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/elstern-${{ github.event.release.tag_name || github.sha }}.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: ${{ runner.temp }}/elstern-*.apk
      - if: github.event_name == 'release'
        run: gh release upload "$TAG" "$RUNNER_TEMP/elstern-$NAME.apk" --repo "$GITHUB_REPOSITORY"
