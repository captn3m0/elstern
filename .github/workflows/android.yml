name: android

on:
  push:
    branches: ["**"]
    tags: ["android/*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions: {}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
          cache-disabled: true
      - run: gradle --no-daemon testDebugUnitTest assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk

  apk:
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: android
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
          cache-disabled: true
      - name: Name the APK
        run: |
          NAME=${TAG#android/}
          echo "APK=$RUNNER_TEMP/elstern-${NAME:-$GITHUB_SHA}.apk" >> "$GITHUB_ENV"
      - if: env.TAG != ''
        name: Check tag matches versionName
        run: |
          v=$(sed -n "s/.*versionName '\(.*\)'/\1/p" android/app/build.gradle)
          [ "$TAG" = "android/$v" ] || { echo "tag $TAG != android/$v"; exit 1; }
      - name: Build signed APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          export KS_FILE="$RUNNER_TEMP/release.p12"
          base64 -d <<<"$KS_B64" > "$KS_FILE"
          gradle --no-daemon testDebugUnitTest assembleRelease
          rm -f "$KS_FILE"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.APK }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: ${{ env.APK }}
      - if: env.TAG != ''
        run: gh release create "$TAG" "$APK" --title "Android ${TAG#android/}" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
