[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "elstern"
dynamic = ["version"]
description = "A free, software-only client for ElsterSecure (Mein ELSTER) passwordless login"
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Nemo", email = "pypi@captnemo.in" }]
keywords = ["elster", "elstersecure", "mein-elster", "germany", "tax", "authentication"]
dependencies = ["cryptography>=42"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/captn3m0/elstern"
Issues = "https://github.com/captn3m0/elstern/issues"

[project.scripts]
elstern = "elstern.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/elstern"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/contrib", "/docs", "/README.md", "/LICENSE"]
